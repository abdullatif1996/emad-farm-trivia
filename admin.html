<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الأسئلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- بوابة كلمة السر -->
  <div class="login-gate" id="loginGate">
    <div class="login-box panel">
      <h2>دخول إدارة الأسئلة</h2>
      <div class="form-field">
        <label for="passwordInput">كلمة السر</label>
        <input type="password" id="passwordInput" autocomplete="off" />
      </div>
      <button class="btn btn-primary" id="btnLogin" style="width:100%;">دخول</button>
      <p class="error-text hidden" id="loginError">كلمة السر غير صحيحة</p>
    </div>
  </div>

  <!-- لوحة الإدارة -->
  <div id="adminPanel" class="hidden">
    <div class="top-bar">
      <h1>إدارة الأسئلة</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <div id="connectionStatus" class="connection-status">
          <span class="status-dot"></span>
          <span class="status-text">جاري الاتصال...</span>
        </div>
        <div class="top-bar-links">
          <a href="index.html">الرئيسية</a>
          <a href="host.html">لوحة الهوست</a>
        </div>
      </div>
    </div>

    <div class="container">

      <div class="panel">
        <h2>إضافة سؤال جديد</h2>
        <form id="questionForm">
          <div class="form-field">
            <label for="fieldCategory">التصنيف</label>
            <input type="text" id="fieldCategory" list="categoryOptions" placeholder="مثال: رياضة" required />
            <datalist id="categoryOptions"></datalist>
          </div>

          <div class="form-field">
            <label for="fieldTitle">عنوان السؤال</label>
            <input type="text" id="fieldTitle" placeholder="مثال: آخر 10 أندية مختلفة حققت دوري أبطال أوروبا" required />
          </div>

          <div class="form-field">
            <label for="fieldHint">ملاحظة (اختياري)</label>
            <input type="text" id="fieldHint" placeholder="مثال: كل نادٍ يُحسب مرة واحدة فقط" />
          </div>

          <div class="form-field">
            <label>الإجابات (الأحدث زمنيًا أولًا = أقل نقاط)</label>
            <div id="answerRows"></div>
            <button type="button" class="btn btn-sm" id="btnAddRow">+ إضافة إجابة</button>
          </div>

          <p class="error-text hidden" id="formError"></p>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">حفظ السؤال</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>أسئلة جاهزة للتجربة</h2>
        <p class="empty-note">يضيف سؤالين جاهزين فورًا للتجربة.</p>
        <div class="btn-row">
          <button class="btn" id="btnImportSample">استيراد أسئلة تجريبية</button>
        </div>
      </div>

      <div class="panel">
        <h2>الأسئلة الموجودة</h2>
        <div id="existingQuestions">
          <p class="empty-note">لا توجد أسئلة بعد.</p>
        </div>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

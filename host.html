<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الهوست</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- بوابة كلمة السر الموحدة -->
  <div class="login-gate" id="loginGate">
    <div class="login-box panel">
      <h2>دخول الهوست</h2>
      <div class="form-field">
        <label for="passwordInput">كلمة السر</label>
        <input type="password" id="passwordInput" autocomplete="off" />
      </div>
      <button class="btn btn-primary" id="btnLogin" style="width:100%;">دخول</button>
      <p class="error-text hidden" id="loginError">كلمة السر غير صحيحة</p>
    </div>
  </div>

  <!-- شاشة اختيار اللعبة -->
  <div class="login-gate hidden" id="chooserGate">
    <div class="login-box panel">
      <h2>اختر اللعبة</h2>
      <div class="landing-links" style="margin-top:18px;">
        <a class="big-link" href="host1.html">
          اللعبة الأولى
          <small>آخر شي مختلف</small>
        </a>
        <a class="big-link" href="host2.html">
          اللعبة الثانية
          <small>أسرع واحد يضغط</small>
        </a>
      </div>
    </div>
  </div>

  <script src="js/host-gate.js"></script>
</body>
</html>
